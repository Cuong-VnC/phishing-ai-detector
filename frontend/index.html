<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield-AI | Kiểm tra link lừa đảo</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">
                <i data-lucide="shield-check"></i>
                <span>ScamShield-AI</span>
            </div>
            <div class="system-status">
                <span class="dot"></span> Đang hoạt động
            </div>
        </nav>

        <section class="search-section">
            <div class="search-card">
                <div class="input-group">
                    <i data-lucide="link" class="icon-link"></i>
                    <input type="text" id="urlInput" placeholder="Dán link cần kiểm tra vào đây..." autocomplete="off">
                </div>
                <button onclick="analyzeURL()" id="scanBtn">
                    <span>Kiểm tra ngay</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </section>

        <main id="result-area" class="result-container" style="display:none">
            <div id="mainVerdict" class="verdict-main-card">
                <div class="verdict-content">
                    <div class="verdict-icon" id="verdictIcon">
                        <i data-lucide="shield-check"></i>
                    </div>
                    <div class="verdict-info">
                        <h2 id="verdictText">Kết quả phân tích</h2>
                        <p id="probabilityDesc">Kết quả dựa trên các chỉ số kỹ thuật của đường link.</p>
                    </div>
                </div>

                <div class="risk-bar-container">
                    <div class="risk-labels">
                        <span>Mức độ rủi ro</span>
                        <span id="probabilityText">0%</span>
                    </div>
                    <div class="bar-bg">
                        <div id="probFill" class="bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-card">
                    <div class="detail-label">Tuổi tên miền</div>
                    <div class="detail-value" id="resAge">N/A</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Trạng thái DNS</div>
                    <div class="detail-value" id="resDNS">Unknown</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Rủi ro mạo danh</div>
                    <div class="detail-value" id="resImpersonation">Thấp</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Link rút gọn</div>
                    <div class="detail-value" id="resShortened">Không</div>
                </div>
            </div>

            <div class="action-footer">
                <button class="btn-secondary" onclick="resetCheck()">
                    <i data-lucide="rotate-ccw"></i> Xóa và kiểm tra link khác
                </button>
            </div>
        </main>

        <footer class="footer">
            ScamShield-AI — Dự án học tập phát hiện URL lừa đảo bằng học máy
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
